[package]
name = "ingestion"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
rumqttc = "0.25.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres"] }
tokio = { version = "1.53.1", features = ["full"] }
